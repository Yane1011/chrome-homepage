<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="bg"></div>
  <canvas id="bg-canvas" hidden></canvas>
  <div id="bg-dim"></div>

  <div id="app">
    <div id="corner">
      <button id="widgets-toggle" class="corner-btn" title="Widgets" aria-label="Show widgets">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button id="downloads-btn" class="corner-btn" title="Downloads" aria-label="Downloads" data-url="chrome://downloads">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>
      </button>
      <button id="history-btn" class="corner-btn" title="History" aria-label="History" data-url="chrome://history">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4h4M12 7.5V12l3 2"/></svg>
      </button>
      <button id="settings-btn" class="corner-btn" title="Settings (,)" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>

    <aside id="wt" class="widgets row" hidden></aside>
    <aside id="wl" class="widgets col" hidden></aside>

    <main id="main">
      <section id="hero">
        <div id="clock" aria-live="off"></div>
        <div id="subline"></div>
      </section>

      <section id="search">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search-input" type="text" autocomplete="off" spellcheck="false" aria-label="Search">
          <span id="search-engine"></span>
        </div>
        <div id="search-results" hidden></div>
      </section>

      <div id="shortcuts">
        <button id="shortcuts-toggle" class="pill-btn" title="Show shortcuts">Shortcuts</button>
        <nav id="essentials" class="essentials" aria-label="Essentials"></nav>
        <section id="folders" class="folders" aria-label="Folders"></section>
      </div>

      <aside id="wb" class="widgets row" hidden></aside>
    </main>

    <aside id="wr" class="widgets col" hidden></aside>

    <nav id="desks" hidden></nav>
  </div>

  <div id="folder-overlay" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" role="status"></div>
</body>
</html>
